name: NationStates AutoTelegram

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nationstates-auto-telegram
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run bot
        env:
          TGID: ${{ secrets.TGID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NS_CLIENT_KEY: ${{ secrets.NS_CLIENT_KEY }}
        run: node bot.js

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update bot state"
            git push
          fi
