name: NationStates AutoTelegram

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  bot:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run bot
        env:
          NS_CLIENT_KEY: ${{ secrets.NS_CLIENT_KEY }}
          TGID: ${{ secrets.TGID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          USER_AGENT: ${{ secrets.USER_AGENT }}
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "NationStates AutoTelegram"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update NationStates bot state"
            git push
          fi
